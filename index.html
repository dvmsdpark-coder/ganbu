<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>농림축산식품부 일정관리 프로그램</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <section id="authScreen" class="auth-screen">
      <div class="auth-card">
        <div class="brand auth-brand">
          <img class="brand-mark" src="government-emblem.webp" alt="대한민국 정부 상징">
          <div>
            <h1>농림축산식품부 일정관리 프로그램</h1>
            <p>승인된 사용자만 접속할 수 있습니다.</p>
          </div>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="인증">
          <button id="loginTabButton" class="segment active" type="button">로그인</button>
          <button id="signupTabButton" class="segment" type="button">회원가입</button>
        </div>

        <form id="loginForm" class="auth-form">
          <label>
            <span>이메일</span>
            <input id="loginEmail" type="email" autocomplete="email" required>
          </label>
          <label>
            <span>비밀번호</span>
            <input id="loginPassword" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary-button" type="submit">로그인</button>
        </form>

        <form id="signupForm" class="auth-form hidden">
          <label>
            <span>이름</span>
            <input id="signupName" type="text" autocomplete="name" required>
          </label>
          <label>
            <span>소속</span>
            <select id="signupDivision" required></select>
          </label>
          <label>
            <span>이메일</span>
            <input id="signupEmail" type="email" autocomplete="email" required>
          </label>
          <label>
            <span>비밀번호</span>
            <input id="signupPassword" type="password" autocomplete="new-password" minlength="6" required>
          </label>
          <button class="primary-button" type="submit">가입 신청</button>
        </form>

        <p id="authMessage" class="auth-message"></p>
      </div>
    </section>

    <section id="pendingScreen" class="auth-screen hidden">
      <div class="auth-card">
        <div class="brand auth-brand">
          <img class="brand-mark" src="government-emblem.webp" alt="대한민국 정부 상징">
          <div>
            <h1>승인 대기</h1>
            <p id="pendingMessage">총관리자 승인 후 접속할 수 있습니다.</p>
          </div>
        </div>
        <button id="pendingLogoutButton" class="text-button" type="button">로그아웃</button>
      </div>
    </section>

    <div id="appShell" class="app-shell hidden">
      <header class="topbar">
        <div class="brand">
          <img class="brand-mark" src="government-emblem.webp" alt="대한민국 정부 상징">
          <div>
            <h1>농림축산식품부 일정관리 프로그램</h1>
            <p id="todayLabel"></p>
          </div>
        </div>
        <div class="session-panel" aria-label="접속 정보">
          <label>
            <span>접속 국</span>
            <select id="divisionSelect"></select>
          </label>
          <label>
            <span>권한</span>
            <select id="roleSelect">
              <option value="member">구성원</option>
              <option value="division_admin">국 관리자</option>
              <option value="super_admin">총관리자</option>
            </select>
          </label>
          <label>
            <span>사용자</span>
            <input id="userNameInput" type="text" autocomplete="name">
          </label>
          <button id="logoutButton" class="text-button session-logout" type="button">로그아웃</button>
        </div>
      </header>

      <main class="main-layout">
        <aside class="rail">
          <section class="panel">
            <div class="panel-heading">
              <h2>필터</h2>
              <button id="resetFilterButton" class="icon-button" type="button" title="필터 초기화" aria-label="필터 초기화">↺</button>
            </div>
            <div class="filter-list" id="rankFilters"></div>
          </section>

          <section class="panel">
            <div class="panel-heading">
              <h2>범례</h2>
            </div>
            <div class="legend" id="legend"></div>
          </section>

          <section class="panel">
            <div class="panel-heading">
              <h2>변경 이력</h2>
            </div>
            <div class="history-list" id="historyList"></div>
          </section>

          <section id="userApprovalPanel" class="panel hidden">
            <div class="panel-heading">
              <h2>사용자 승인</h2>
              <button id="refreshUsersButton" class="icon-button" type="button" title="새로고침" aria-label="사용자 목록 새로고침">↺</button>
            </div>
            <div id="userApprovalList" class="approval-list"></div>
          </section>
        </aside>

        <section class="workspace">
          <div class="toolbar">
            <div class="date-controls">
              <button id="prevButton" class="icon-button" type="button" title="이전" aria-label="이전">‹</button>
              <div>
                <div id="periodTitle" class="period-title"></div>
                <div id="periodSubtitle" class="period-subtitle"></div>
              </div>
              <button id="nextButton" class="icon-button" type="button" title="다음" aria-label="다음">›</button>
              <button id="todayButton" class="text-button" type="button">오늘</button>
            </div>

            <div class="view-actions">
              <div class="segmented" role="tablist" aria-label="보기 전환">
                <button id="monthViewButton" class="segment active" type="button" role="tab" aria-selected="true">월간</button>
                <button id="weekViewButton" class="segment" type="button" role="tab" aria-selected="false">주간</button>
              </div>
              <label class="switch">
                <input id="showArchivedToggle" type="checkbox">
                <span>지난 일정</span>
              </label>
              <button id="newEventButton" class="primary-button" type="button">+ 일정</button>
            </div>
          </div>

          <div class="notice-bar" id="permissionNotice"></div>

          <div id="monthView" class="calendar-view"></div>
          <div id="weekView" class="week-view hidden"></div>
        </section>
      </main>
    </div>

    <dialog id="eventDialog" class="event-dialog">
      <form id="eventForm" method="dialog">
        <div class="dialog-head">
          <h2 id="dialogTitle">일정 등록</h2>
          <button id="closeDialogButton" class="icon-button" type="button" title="닫기" aria-label="닫기">×</button>
        </div>

        <input id="eventId" type="hidden">
        <div class="form-grid">
          <label>
            <span>날짜</span>
            <input id="eventDate" type="date" required>
          </label>
          <label>
            <span>시작</span>
            <div class="time-input-group">
              <div class="period-toggle" aria-label="시작 시간 오전 오후 선택">
                <button type="button" data-time-period="start" data-period="am" aria-pressed="false">오전</button>
                <button type="button" data-time-period="start" data-period="pm" aria-pressed="false">오후</button>
              </div>
              <input id="eventStartTime" type="time" required>
            </div>
          </label>
          <label>
            <span>종료</span>
            <div class="time-input-group">
              <div class="period-toggle" aria-label="종료 시간 오전 오후 선택">
                <button type="button" data-time-period="end" data-period="am" aria-pressed="false">오전</button>
                <button type="button" data-time-period="end" data-period="pm" aria-pressed="false">오후</button>
              </div>
              <input id="eventEndTime" type="time">
            </div>
          </label>
          <label>
            <span>구분</span>
            <select id="eventRank" required></select>
          </label>
          <label>
            <span>대상</span>
            <input id="eventPerson" type="text" placeholder="예: 방역정책과장" required>
          </label>
          <label>
            <span>장소</span>
            <input id="eventLocation" type="text" placeholder="예: 대회의실">
          </label>
        </div>

        <label class="wide-field">
          <span>일정</span>
          <input id="eventTitle" type="text" placeholder="예: 국정과제 점검회의" required>
        </label>

        <label class="wide-field">
          <span>메모</span>
          <textarea id="eventMemo" rows="3" placeholder="공개 일정 출처, 변경 사유 등"></textarea>
        </label>

        <label id="eventShareField" class="share-field hidden">
          <input id="eventShareDownstream" type="checkbox">
          <span>
            <strong id="eventShareTitle">하위 조직에 일정 공개</strong>
            <small id="eventShareDescription"></small>
          </span>
        </label>

        <div class="dialog-actions">
          <button id="deleteEventButton" class="danger-button" type="button">삭제</button>
          <div class="spacer"></div>
          <button class="text-button" type="button" id="cancelButton">취소</button>
          <button class="primary-button" type="submit">저장</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
